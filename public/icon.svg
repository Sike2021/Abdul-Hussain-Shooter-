<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Tactical Radar Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="12 8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="120" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="392" x2="256" y2="476" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="120" y2="256" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="476" y2="256" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Tactical Shield -->
  <path d="M256 160 L330 200 L310 290 L256 340 L202 290 L182 200 Z" fill="#00e5ff" fill-opacity="0.15" stroke="url(#cyanGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Target Center Dot -->
  <circle cx="256" cy="256" r="24" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  
  <!-- 2v2 Badge text -->
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#00e5ff" letter-spacing="6">2 VS 2</text>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#a1a1aa" letter-spacing="3">TACTICAL CQB</text>
</svg>
